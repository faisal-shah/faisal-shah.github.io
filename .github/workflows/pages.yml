name: Deploy site

# The site is plain static HTML. GitHub's legacy Pages builder stopped running
# for this repo (builds returning duration=0ms with no content cause), so the
# site is published from Actions instead — the same mechanism the project repos
# already use.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight; let queued ones run in order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stage exactly what should be served, so repo plumbing never ships.
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          echo "--- publishing:"
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The default 10-minute wait is not always enough: a deploy has
          # completed successfully well past it and only the confirmation
          # timed out, reporting a red run for a site that was already live.
          timeout: 1800000
